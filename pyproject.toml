[project]
name = "langley"
version = "0.1.0"
description = "Langley backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncmy>=0.2",
    "cryptography>=44.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langsmith>=0.3",
    "markdown-it-py>=4.2,<5",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "semantic-text-splitter>=0.32,<0.33",
    "structlog>=25.0",
    "tavily-python==0.8.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "alembic>=1.14",
    "mypy>=1.13",
    "numpy>=2.0,<3",
    "pytest>=8.3",
    "ruff>=0.8",
]
eval = [
    "sentence-transformers>=5.0,<6",
    "torch>=2.13,<3",
    "transformers>=5.0,<6",
]
qdrant = [
    "qdrant-client==1.19.0",
]
retrieval = [
    { include-group = "eval" },
    { include-group = "qdrant" },
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests/fast"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/fixtures/knowledge/retrieval/documents"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
