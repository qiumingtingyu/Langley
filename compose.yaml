services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: langley
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${LANGLEY_MYSQL_ROOT_PASSWORD:?set protected local variable}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - langley_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -uroot --batch --skip-column-names --execute=\"SELECT 1\" >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  langley_mysql_data:
